<title>PRIYO APP</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;

button{font:inherit;cursor:pointer}
.app{

/* HEADER */
header{

.circle{

.logo{

.head-right{display:flex;gap:6px}

/* MAIN */
main{flex:1;min-height:0;overflow:hidden;padding:8px 10px}
.home{height:100%;display:flex;flex-direction:column;gap:6px}

/* ADS */
.ads{

}
.ad{

}
.ad1{background-image:url("home_ad1.png")}
.ad2{background-image:url("home_ad2.png")}

.dots{

 font-size:8px;color:#b7c1ce
}
.dots b{color:#315de8}

/* WELCOME */
.welcome{

 background:url("home_welcome.png") center/cover no-repeat;
 box-shadow:0 5px 15px #24508014
}
